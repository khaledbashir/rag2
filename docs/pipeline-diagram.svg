<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A52EF"/>
      <stop offset="100%" stop-color="#0840C0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="16" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">ANC RFP Extraction Pipeline</text>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="#94A3B8">Automatic classification • Dual-AI verification • Zero user decisions</text>

  <!-- STEP 1: Upload -->
  <rect x="340" y="78" width="220" height="48" rx="24" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="450" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="white">Upload PDF</text>

  <!-- Arrow -->
  <line x1="450" y1="126" x2="450" y2="148" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowGray)"/>
  <defs><marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#CBD5E1"/></marker></defs>

  <!-- STEP 2: pdfplumber -->
  <rect x="290" y="152" width="320" height="52" rx="10" fill="url(#gray)" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="450" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Step 1: pdfplumber</text>
  <text x="450" y="192" text-anchor="middle" font-size="10" fill="#64748B">Deterministic table extraction — free, instant</text>

  <!-- Branch: found displays or not -->
  <line x1="380" y1="204" x2="380" y2="228" stroke="#10B981" stroke-width="2"/>
  <line x1="520" y1="204" x2="520" y2="228" stroke="#F59E0B" stroke-width="2"/>

  <!-- Left branch: found displays -->
  <rect x="280" y="228" width="200" height="36" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="380" y="251" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Found displays → Done</text>
  <text x="380" y="275" text-anchor="middle" font-size="9" fill="#10B981">Panthers Combined: 47/47</text>

  <!-- Right branch: 0 displays -->
  <rect x="420" y="228" width="200" height="36" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="520" y="251" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">0 displays → Classify</text>

  <!-- Arrow to classify -->
  <line x1="520" y1="264" x2="520" y2="295" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- STEP 3: Classify -->
  <rect x="370" y="298" width="300" height="52" rx="10" fill="url(#gray)" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="520" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Step 2: Auto-Classify PDF</text>
  <text x="520" y="338" text-anchor="middle" font-size="10" fill="#64748B">pdftotext scan → text length + LED keywords → route</text>

  <!-- Branch: text or drawing -->
  <line x1="460" y1="350" x2="360" y2="380" stroke="#0A52EF" stroke-width="2"/>
  <line x1="580" y1="350" x2="680" y2="380" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Left: Text PDF → Kreuzberg -->
  <rect x="240" y="382" width="240" height="52" rx="10" fill="#EFF6FF" stroke="#BFDBFE" filter="url(#shadow)"/>
  <text x="360" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Text PDF → Kreuzberg</text>
  <text x="360" y="420" text-anchor="middle" font-size="10" fill="#3B82F6">Free, self-hosted, ~100ms, inline tables</text>

  <!-- Right: Drawing PDF → Marker -->
  <rect x="560" y="382" width="240" height="52" rx="10" fill="#F5F3FF" stroke="#DDD6FE" filter="url(#shadow)"/>
  <text x="680" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#5B21B6">Drawing → Marker</text>
  <text x="680" y="420" text-anchor="middle" font-size="10" fill="#8B5CF6">Free, self-hosted, reads image tables</text>

  <!-- Merge arrows to GPT -->
  <line x1="360" y1="434" x2="450" y2="464" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="680" y1="434" x2="550" y2="464" stroke="#CBD5E1" stroke-width="2"/>

  <!-- STEP 4: GPT-5.4-mini -->
  <rect x="350" y="466" width="200" height="52" rx="10" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="450" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="white">Step 3: Extract</text>
  <text x="450" y="505" text-anchor="middle" font-size="10" fill="#93C5FD">GPT-5.4-mini • temp 0 • ~5s</text>

  <!-- Arrow -->
  <line x1="450" y1="518" x2="450" y2="542" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- STEP 5: QA Cross-check -->
  <rect x="330" y="545" width="240" height="52" rx="10" fill="url(#orange)" filter="url(#shadow)"/>
  <text x="450" y="567" text-anchor="middle" font-size="12" font-weight="700" fill="white">Step 4: Verify</text>
  <text x="450" y="584" text-anchor="middle" font-size="10" fill="#FEF3C7">Different AI cross-checks the count</text>

  <!-- Arrow -->
  <line x1="450" y1="597" x2="450" y2="621" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- STEP 6: Product Match -->
  <rect x="340" y="624" width="220" height="44" rx="10" fill="url(#green)" filter="url(#shadow)"/>
  <text x="450" y="651" text-anchor="middle" font-size="12" font-weight="600" fill="white">Step 5: Match Products + Price</text>

  <!-- Test results box -->
  <rect x="30" y="470" width="260" height="120" rx="10" fill="white" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="160" y="493" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Verified Results</text>
  <line x1="50" y1="502" x2="270" y2="502" stroke="#E2E8F0"/>
  <text x="55" y="522" font-size="11" fill="#334155">Panthers Indoor</text>
  <text x="260" y="522" text-anchor="end" font-size="11" font-weight="700" fill="#10B981">25/25 ✓</text>
  <text x="55" y="542" font-size="11" fill="#334155">Panthers Outdoor</text>
  <text x="260" y="542" text-anchor="end" font-size="11" font-weight="700" fill="#10B981">18/18 ✓</text>
  <text x="55" y="562" font-size="11" fill="#334155">AV Schedules (Combined)</text>
  <text x="260" y="562" text-anchor="end" font-size="11" font-weight="700" fill="#10B981">47/47 ✓</text>
  <text x="55" y="582" font-size="11" fill="#334155">Haslam Sports</text>
  <text x="260" y="582" text-anchor="end" font-size="11" font-weight="700" fill="#10B981">5/5 ✓</text>

  <!-- Key principles box -->
  <rect x="620" y="470" width="250" height="120" rx="10" fill="white" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="745" y="493" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Design Principles</text>
  <line x1="640" y1="502" x2="850" y2="502" stroke="#E2E8F0"/>
  <text x="635" y="522" font-size="10" fill="#334155">→ One upload, zero user decisions</text>
  <text x="635" y="540" font-size="10" fill="#334155">→ Auto-classifies text vs drawing PDFs</text>
  <text x="635" y="558" font-size="10" fill="#334155">→ Two AIs verify independently</text>
  <text x="635" y="576" font-size="10" fill="#334155">→ No single model dependency</text>
</svg>
